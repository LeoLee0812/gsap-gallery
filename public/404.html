<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · GSAP 动效图鉴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #e6edf3; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    text-align: center; padding: 24px;
  }
  .code {
    font-size: clamp(56px, 14vw, 96px); font-weight: 900; letter-spacing: -2px;
    background: linear-gradient(135deg, #58e6a8, #3b82f6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { color: #8b949e; font-size: 15px; }
  a {
    margin-top: 8px; padding: 10px 22px; border: 1px solid #30363d; border-radius: 8px;
    color: #e6edf3; text-decoration: none; font-size: 14px; transition: border-color .2s;
  }
  a:hover { border-color: #58e6a8; }
</style>
</head>
<body>
  <div class="code">404</div>
