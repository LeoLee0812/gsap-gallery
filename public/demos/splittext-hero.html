<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>SplitText Hero · GSAP 实战场景</title>
<!-- GSAP 核心库 -->
<script src="../lib/gsap.min.js"></script>
<!-- SplitText 拆字插件 -->
<script src="../lib/SplitText.min.js"></script>
<style>
  /* 暗色主题统一变量 */
  :root {
    --bg: #0d1117;        /* 页面背景 */
    --text: #e6edf3;      /* 主文字 */
    --accent: #58e6a8;    /* 强调色 */
    --card: #161b22;      /* 卡片背景 */
    --border: #30363d;    /* 边框 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Hero 区容器 */
  .hero {
    text-align: center;
    padding: 2rem;
    max-width: 880px;
  }

  /* 主标题：大号、加粗 */
  .hero-title {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }
  /* 高亮单词用强调色 */
  .hero-title .accent { color: var(--accent); }

  /* 副标题：中等灰白 */
  .hero-sub {
    font-size: clamp(1rem, 2.4vw, 1.5rem);
    font-weight: 400;
    color: #9da7b3;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }

  /* CTA 按钮 */
  .cta {
    display: inline-block;
    background: var(--accent);
    color: #04231a;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 0.9rem 2.4rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(88, 230, 168, 0.25);
  }
  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(88, 230, 168, 0.4);
  }

  /* 重新播放按钮：固定右下角 */
  .replay {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.6rem 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .replay:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* 拆字后每个字符默认隐藏，避免字体加载前闪现 */
  .char { display: inline-block; }
</style>
</head>
<body>
  <main class="hero">
    <h1 class="hero-title">用动效，<span class="accent">点亮</span>你的产品</h1>
    <p class="hero-sub">从这一刻起，让每一次交互都充满呼吸感与生命力。</p>
    <button class="cta" id="cta">立即开始</button>
  </main>

  <button class="replay" id="replay">↻ 重新播放</button>

  <script>
    // 注册 SplitText 插件（必须）
    gsap.registerPlugin(SplitText);

    let titleSplit, subSplit, masterTl;

    // 构建并播放整条入场时间轴
    function buildAnimation() {
      // 重播时先还原上一次的拆字结果，避免重复嵌套
      if (titleSplit) titleSplit.revert();
      if (subSplit) subSplit.revert();

      // 主标题：拆成单字
      titleSplit = new SplitText(".hero-title", {
        type: "chars",
        charsClass: "char",
      });
      // 副标题：拆成单字
      subSplit = new SplitText(".hero-sub", {
        type: "chars",
        charsClass: "char",
      });

      // 创建主时间轴
      masterTl = gsap.timeline();

      // 1) 主标题逐字从下方弹起入场
      masterTl.from(titleSplit.chars, {
        y: 80,            // 从下方 80px 处
        opacity: 0,
        rotateX: -90,     // 轻微翻转增强弹起感
        duration: 0.8,
        ease: "back.out(1.7)", // 回弹缓动
        stagger: 0.04,    // 逐字间隔
      });

      // 2) 副标题逐字波浪淡入（与主标题尾段轻微重叠）
      masterTl.from(subSplit.chars, {
        y: 20,
        opacity: 0,
        duration: 0.5,
        ease: "sine.out",
        stagger: {
          each: 0.02,
          from: "start", // 从左到右形成波浪
        },
      }, "-=0.4");

      // 3) CTA 按钮最后淡入并轻微弹一下
      masterTl.from("#cta", {
        y: 16,
        opacity: 0,
        scale: 0.9,
        duration: 0.6,
        ease: "back.out(2.5)", // 更强回弹，制造"弹一下"效果
      }, "-=0.1");
    }

    // 必须等字体加载完成再拆字，否则字符宽度计算错位
    document.fonts.ready.then(() => {
      buildAnimation();
    });

    // 重新播放：重建动画
    document.getElementById("replay").addEventListener("click", () => {
      if (masterTl) masterTl.kill(); // 终止当前时间轴
      buildAnimation();
    });
  </script>
</body>
</html>
