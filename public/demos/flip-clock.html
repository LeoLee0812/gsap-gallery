<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>翻页时钟 Flip Clock</title>
<style>
  /* 全局暗色主题 */
  :root {
    --bg: #0d1117;
    --text: #e6edf3;
    --accent: #58e6a8;
    --card: #161b22;
    --border: #30363d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    user-select: none;
  }
  h1 {
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--accent);
    opacity: 0.85;
  }

  /* 时钟容器，开启 3D 透视让翻页有立体感 */
  .clock {
    display: flex;
    align-items: center;
    gap: 14px;
    perspective: 1200px;
  }
  /* 一组（时/分/秒），由两位翻页牌组成 */
  .group {
    display: flex;
    gap: 8px;
  }
  /* 时:分:秒之间的冒号分隔符 */
  .sep {
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    align-self: center;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* 单个翻页牌，整体保留 3D 上下文 */
  .flip {
    position: relative;
    width: 84px;
    height: 120px;
    font-size: 88px;
    font-weight: 700;
    line-height: 120px;
    text-align: center;
    transform-style: preserve-3d;
  }
  /* 上下两个半片的公共样式 */
  .flip .half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
  }
  /* 上半片：显示数字上半部分 */
  .flip .top {
    top: 0;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    line-height: 120px;            /* 数字顶端对齐整牌 */
    transform-origin: bottom;
  }
  /* 下半片：显示数字下半部分 */
  .flip .bottom {
    bottom: 0;
    border-top: none;
    border-radius: 0 0 10px 10px;
    line-height: 0;                /* 把数字下半部分顶上来露出 */
    transform-origin: top;
  }
  /* 中间分割线，模拟两片之间的缝隙 */
  .flip::after {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: 2px;
    background: rgba(0,0,0,0.45);
    transform: translateY(-1px);
    z-index: 6;
  }
  /* 翻转片：盖在上半片之上，绕中轴翻下 */
  .flip .fold-top {
    z-index: 5;
    border-radius: 10px 10px 0 0;
    backface-visibility: hidden;
  }
  /* 翻转片：盖在下半片之上，从竖直翻平 */
  .flip .fold-bottom {
    z-index: 5;
    border-radius: 0 0 10px 10px;
    backface-visibility: hidden;
  }

  .hint {
    font-size: 13px;
    color: var(--text);
    opacity: 0.4;
  }

  /* ---- 手机适配：翻页牌按 84px 宽排一整行会撑破 390px 的屏，整体缩一档 ---- */
  @media (max-width: 520px) {
    .clock { gap: 8px; }
    .group { gap: 5px; }
    .flip { width: 46px; height: 66px; font-size: 46px; line-height: 66px; }
    .sep { font-size: 30px; }
  }
</style>
</head>
<body>
  <h1>FLIP CLOCK</h1>
  <div class="clock" id="clock">
    <div class="group" data-unit="h"></div>
    <div class="sep">:</div>
    <div class="group" data-unit="m"></div>
    <div class="sep">:</div>
    <div class="group" data-unit="s"></div>
  </div>
  <div class="hint">基于 GSAP rotationX 的机械翻页牌效果</div>

  <script src="../lib/gsap.min.js"></script>
  <script>
    /* 每个翻页牌由四层构成：
       - top    静态上半片（显示当前数字上半）
       - bottom 静态下半片（显示当前数字下半）
       - fold-top    翻转片上半，翻动上半时绕底边向下转
       - fold-bottom 翻转片下半，翻动下半时绕顶边向上立起再落平
       通过两段 rotationX 动画串联，实现经典 split-flap 翻页 */

    // 创建一个翻页牌 DOM，并返回对其各层的引用
    function createFlip() {
      const flip = document.createElement("div");
      flip.className = "flip";
      flip.innerHTML = `
        <div class="half top">0</div>
        <div class="half bottom">0</div>
        <div class="half top fold-top">0</div>
        <div class="half bottom fold-bottom">0</div>
      `;
      return {
        el: flip,
        top: flip.querySelector(".top:not(.fold-top)"),
        bottom: flip.querySelector(".bottom:not(.fold-bottom)"),
        foldTop: flip.querySelector(".fold-top"),
        foldBottom: flip.querySelector(".fold-bottom"),
        current: "0",
      };
    }

    // 初始化所有翻页牌：时/分/秒各两位，共六位
    const flips = [];
    document.querySelectorAll(".group").forEach((group) => {
      for (let i = 0; i < 2; i++) {
        const f = createFlip();
        group.appendChild(f.el);
        // 翻转下半片初始立起（藏在上方），由动画落平
        gsap.set(f.foldBottom, { rotationX: 180 });
        flips.push(f);
      }
    });

    // 执行单个翻页牌从旧值翻到新值的动画
    function flipTo(f, newVal) {
      if (f.current === newVal) return;
      const oldVal = f.current;
      f.current = newVal;

      // 上半翻转片显示旧值（翻下时露出旧上半）
      f.foldTop.textContent = oldVal;
      // 下半翻转片显示新值（立起时背面其实是新值的下半）
      f.foldBottom.textContent = newVal;
      // 静态上半片立即切到新值（被翻转片盖住，不会穿帮）
      f.top.textContent = newVal;
      // 静态下半片保持旧值，等翻转片落平后再换

      gsap.set(f.foldTop, { rotationX: 0 });
      gsap.set(f.foldBottom, { rotationX: 180 });

      const tl = gsap.timeline();
      // 第一段：上半翻转片绕底边向下翻 90 度（盖住下半旧值前半程）
      tl.to(f.foldTop, {
        rotationX: -90,
        duration: 0.3,
        ease: "power2.in",
      });
      // 第二段：下半翻转片从立起的 180 落回 0（露出新值下半）
      tl.to(f.foldBottom, {
        rotationX: 0,
        duration: 0.3,
        ease: "power2.out",
        onStart: () => {
          // 翻转片越过中线后，把静态下半片换成新值
          f.bottom.textContent = newVal;
        },
      });
    }

    // 把两位数字拆成个位、十位填入对应翻页牌
    function update() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const str = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      for (let i = 0; i < flips.length; i++) {
        flipTo(flips[i], str[i]);
      }
    }

    // 首帧立即同步当前时间（无动画）
    (function initNow() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const str = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      flips.forEach((f, i) => {
        f.current = str[i];
        f.top.textContent = str[i];
        f.bottom.textContent = str[i];
      });
    })();

    // 用 GSAP delayedCall 每秒驱动一次更新，保持节拍稳定
    function tick() {
      update();
      gsap.delayedCall(1, tick);
    }
    // 对齐到下一个整秒再启动，避免半秒抖动
    gsap.delayedCall(1 - (Date.now() % 1000) / 1000, tick);
  </script>

<!-- 图鉴浮条：返回图鉴 + 把这个 demo 的链接和提示词复制给 AI Agent -->
<div id="galleryBar">
  <a href="/" class="gb">← 图鉴</a>
  <button class="gb" id="gbCopy">⧉ 复制给 AI</button>
</div>
<style>
  #galleryBar {
    position: fixed; left: 16px; bottom: 16px; z-index: 9999;
    display: flex; gap: 8px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  #galleryBar .gb {
    font-size: 12px; line-height: 1; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: #8b949e; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    text-decoration: none; backdrop-filter: blur(8px); font-family: inherit;
    transition: color .16s, border-color .16s;
  }
  #galleryBar .gb:hover { color: #58e6a8; border-color: #58e6a8; }
  #galleryBar .gb.done { color: #58e6a8; border-color: rgba(88,230,168,.6); }
  @media (max-width: 520px) { #galleryBar { left: 10px; bottom: 10px; } }
</style>
<script>
  (function () {
    var DEMO = 'flip-clock', TITLE = '翻页时钟 Flip Clock';
    var origin = location.protocol.startsWith('http') ? location.origin : 'https://gsap.leolee0812.site';
    var text = '参考这个页面：' + origin + '/demos/' + DEMO + '.html\n' +
      '它用 GSAP 3.13 实现了「' + TITLE + '」，源码里有完整可运行的实现和中文注释。\n' +
      '请先读取这个链接，弄清它的实现方式（用到哪些插件、时间轴怎么排、缓动怎么选），\n' +
      '然后把同样的效果复刻到我的项目里：沿用我现有的页面结构和配色，保持一致的节奏和手感。';
    var btn = document.getElementById('gbCopy');
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '✓ 已复制，粘给你的 Agent';
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          btn.textContent = '⧉ 复制给 AI';
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        done();
      }
    });
  })();
</script>
</body>
</html>
