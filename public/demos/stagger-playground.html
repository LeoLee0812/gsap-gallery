<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>Stagger 交错实验台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh; padding: 40px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  h1 { font-size: 22px; font-weight: 700; }
  .sub { font-size: 14px; opacity: .55; margin-top: -16px; text-align: center; }
  .panel {
    display: flex; gap: 26px; flex-wrap: wrap; justify-content: center;
    background: #161b22; border: 1px solid #30363d; border-radius: 14px;
    padding: 18px 24px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 6px; }
  .ctrl label { font-size: 12px; opacity: .6; }
  .ctrl .row { display: flex; gap: 6px; }
  .opt {
    background: #0d1117; color: #8b949e; border: 1px solid #30363d;
    border-radius: 7px; padding: 6px 12px; font-size: 13px;
    font-family: inherit; cursor: pointer; transition: all .16s;
  }
  .opt:hover { border-color: #58e6a8; color: #e6edf3; }
  .opt.on { background: #58e6a8; color: #0d1117; border-color: #58e6a8; font-weight: 600; }
  input[type=range] { width: 130px; accent-color: #58e6a8; }
  .val { font-size: 12px; color: #58e6a8; font-family: ui-monospace, Menlo, monospace; }
  /* 8x8 方块矩阵，用来观察不同 from 模式的扩散方向 */
  #grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px;
  }
  .box {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, #58e6a8, #3b82f6);
  }
  pre {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 14px 18px; font-size: 13px; line-height: 1.7;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8b949e; max-width: 560px; overflow-x: auto;
  }
  pre .k { color: #58e6a8; }
  .replay {
    background: #58e6a8; color: #0d1117; border: 0; border-radius: 24px;
    padding: 11px 30px; font-size: 15px; font-weight: 600; cursor: pointer;
  }

  /* ---- 手机适配：代码块 max-width:560px 比屏还宽，且 8 列方块要缩 ---- */
  @media (max-width: 520px) {
    pre { max-width: 100%; width: 100%; box-sizing: border-box; }
    #grid { gap: 6px; }
    .box { width: 34px; height: 34px; }
  }
</style>
</head>
<body>
  <h1>Stagger 交错实验台</h1>
  <p class="sub">一排元素依次出场，而不是同时出场——「高级」和「廉价」的分水岭就在这里</p>

  <div class="panel">
    <div class="ctrl">
      <label>from（起点方向）</label>
      <div class="row" id="fromRow">
        <button class="opt on" data-from="start">start</button>
        <button class="opt" data-from="center">center</button>
        <button class="opt" data-from="end">end</button>
        <button class="opt" data-from="edges">edges</button>
        <button class="opt" data-from="random">random</button>
      </div>
    </div>
    <div class="ctrl">
      <label>grid（是否按二维网格计算距离）</label>
      <div class="row" id="gridRow">
        <button class="opt on" data-grid="auto">auto（二维）</button>
        <button class="opt" data-grid="none">不启用（一维）</button>
      </div>
    </div>
    <div class="ctrl">
      <label>axis（只按某一轴扩散）</label>
      <div class="row" id="axisRow">
        <button class="opt on" data-axis="">不限</button>
        <button class="opt" data-axis="x">x</button>
        <button class="opt" data-axis="y">y</button>
      </div>
    </div>
    <div class="ctrl">
      <label>each 间隔 <span class="val" id="eachVal">0.05s</span></label>
      <input type="range" id="each" min="0.01" max="0.2" step="0.01" value="0.05">
    </div>
  </div>

  <div id="grid"></div>
  <button class="replay" id="replay">▶ 重新播放</button>
  <pre id="code"></pre>

<script src="../lib/gsap.min.js"></script>
<script>
  // 生成 64 个方块（8×8），足够看清扩散形状
  const grid = document.getElementById('grid');
  for (let i = 0; i < 64; i++) {
    const b = document.createElement('div');
    b.className = 'box';
    grid.appendChild(b);
  }

  // 当前配置
  const state = { from: 'start', grid: 'auto', axis: '', each: 0.05 };

  // 一组互斥按钮的通用绑定
  function bindRow(rowId, key, attr) {
    document.getElementById(rowId).addEventListener('click', e => {
      const btn = e.target.closest('.opt');
      if (!btn) return;
      document.querySelectorAll(`#${rowId} .opt`).forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      state[key] = btn.dataset[attr];
      play();
    });
  }
  bindRow('fromRow', 'from', 'from');
  bindRow('gridRow', 'grid', 'grid');
  bindRow('axisRow', 'axis', 'axis');

  const eachInput = document.getElementById('each');
  eachInput.addEventListener('input', () => {
    state.each = parseFloat(eachInput.value);
    document.getElementById('eachVal').textContent = state.each.toFixed(2) + 's';
    play();
  });

  document.getElementById('replay').addEventListener('click', play);

  function play() {
    // 组装 stagger 配置对象；grid 选 none 时干脆不传该字段，按一维索引计算
    const stagger = { each: state.each, from: state.from };
    if (state.grid === 'auto') stagger.grid = 'auto';
    if (state.axis) stagger.axis = state.axis;

    gsap.killTweensOf('.box');
    gsap.fromTo('.box',
      { scale: 0, opacity: 0, rotate: -90 },
      { scale: 1, opacity: 1, rotate: 0, duration: 0.5, ease: 'back.out(1.7)', stagger }
    );

    // 把当前配置回显成可直接复制的代码
    const lines = [`each: ${state.each}`, `from: "${state.from}"`];
    if (state.grid === 'auto') lines.push('grid: "auto"');
    if (state.axis) lines.push(`axis: "${state.axis}"`);
    document.getElementById('code').innerHTML =
      `<span class="k">gsap</span>.from(<span class="k">".box"</span>, {\n` +
      `  scale: 0, opacity: 0, rotate: -90,\n` +
      `  duration: 0.5, ease: <span class="k">"back.out(1.7)"</span>,\n` +
      `  stagger: { ${lines.join(', ')} }\n});`;
  }

  play();
</script>

<!-- 图鉴浮条：返回图鉴 + 把这个 demo 的链接和提示词复制给 AI Agent -->
<div id="galleryBar">
  <a href="/" class="gb">← 图鉴</a>
  <button class="gb" id="gbCopy">⧉ 复制给 AI</button>
</div>
<style>
  #galleryBar {
    position: fixed; left: 16px; bottom: 16px; z-index: 9999;
    display: flex; gap: 8px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  #galleryBar .gb {
    font-size: 12px; line-height: 1; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: #8b949e; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    text-decoration: none; backdrop-filter: blur(8px); font-family: inherit;
    transition: color .16s, border-color .16s;
  }
  #galleryBar .gb:hover { color: #58e6a8; border-color: #58e6a8; }
  #galleryBar .gb.done { color: #58e6a8; border-color: rgba(88,230,168,.6); }
  @media (max-width: 520px) { #galleryBar { left: 10px; bottom: 10px; } }
</style>
<script>
  (function () {
    var DEMO = 'stagger-playground', TITLE = 'Stagger 交错实验台';
    var origin = location.protocol.startsWith('http') ? location.origin : 'https://gsap.leolee0812.site';
    var text = '参考这个页面：' + origin + '/demos/' + DEMO + '.html\n' +
      '它用 GSAP 3.13 实现了「' + TITLE + '」，源码里有完整可运行的实现和中文注释。\n' +
      '请先读取这个链接，弄清它的实现方式（用到哪些插件、时间轴怎么排、缓动怎么选），\n' +
      '然后把同样的效果复刻到我的项目里：沿用我现有的页面结构和配色，保持一致的节奏和手感。';
    var btn = document.getElementById('gbCopy');
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '✓ 已复制，粘给你的 Agent';
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          btn.textContent = '⧉ 复制给 AI';
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        done();
      }
    });
  })();
</script>
</body>
</html>
