<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>滚动图片遮罩揭示</title>
<style>
  /* 暗色主题基础样式 */
  :root {
    --bg: #0d1117;
    --text: #e6edf3;
    --accent: #58e6a8;
    --card: #161b22;
    --border: #30363d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }
  /* 顶部标题区 */
  header {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  header h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    margin-bottom: 1rem;
  }
  header p {
    color: #8b949e;
    max-width: 480px;
  }
  header .accent { color: var(--accent); }
  /* 图块网格 */
  .gallery {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 30vh;
    display: grid;
    gap: 4rem;
  }
  /* 单个图块卡片：用 CSS 渐变充当图片 */
  .tile {
    position: relative;
    height: 380px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card);
    /* 初始遮挡状态，避免动画前闪现 */
    clip-path: inset(100% 0 0 0);
  }
  .tile .image {
    position: absolute;
    inset: 0;
    border-radius: 14px;
  }
  /* 几种不同的渐变当作不同图片 */
  .img-1 { background: linear-gradient(135deg, #1f6feb, #58e6a8); }
  .img-2 { background: linear-gradient(135deg, #db61a2, #ff7b72); }
  .img-3 { background: linear-gradient(135deg, #a371f7, #1f6feb); }
  .img-4 { background: linear-gradient(135deg, #e3b341, #f0883e); }
  /* 图块上的文字标签 */
  .tile .label {
    position: absolute;
    left: 1.5rem;
    bottom: 1.5rem;
    font-size: 1.25rem;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
    z-index: 2;
  }
  .tile .index {
    position: absolute;
    right: 1.5rem;
    top: 1.5rem;
    font-size: .85rem;
    letter-spacing: .15em;
    color: rgba(255,255,255,.85);
    z-index: 2;
  }
  footer {
    text-align: center;
    padding: 4rem 1rem;
    color: #8b949e;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
  <header>
    <h1>滚动<span class="accent">遮罩揭示</span></h1>
    <p>向下滚动，每个图块在进入视口时通过 clip-path 像拉幕一样揭示出来，并伴随轻微缩放。</p>
  </header>

  <main class="gallery">
    <div class="tile">
      <div class="image img-1"></div>
      <span class="index">01 / 04</span>
      <span class="label">极光</span>
    </div>
    <div class="tile">
      <div class="image img-2"></div>
      <span class="index">02 / 04</span>
      <span class="label">晚霞</span>
    </div>
    <div class="tile">
      <div class="image img-3"></div>
      <span class="index">03 / 04</span>
      <span class="label">星云</span>
    </div>
    <div class="tile">
      <div class="image img-4"></div>
      <span class="index">04 / 04</span>
      <span class="label">沙丘</span>
    </div>
  </main>

  <footer>到底啦 · GSAP ScrollTrigger clip-path 揭示</footer>

  <!-- GSAP 核心与 ScrollTrigger 插件 -->
  <script src="../lib/gsap.min.js"></script>
  <script src="../lib/ScrollTrigger.min.js"></script>
  <script>
    // 注册 ScrollTrigger 插件
    gsap.registerPlugin(ScrollTrigger);

    // 为每个图块创建独立的滚动揭示动画
    gsap.utils.toArray(".tile").forEach((tile) => {
      const image = tile.querySelector(".image");

      // 图块整体：clip-path 从全遮挡拉到全显示（像拉幕）
      gsap.from(tile, {
        clipPath: "inset(100% 0 0 0)",   // 起始：底部完全遮挡
        duration: 1.1,
        ease: "power3.out",
        scrollTrigger: {
          trigger: tile,
          start: "top 80%",              // 图块顶部到达视口 80% 处触发
          toggleActions: "play none none reverse",
        },
      });

      // 内部图片：轻微缩放，营造景深感
      gsap.from(image, {
        scale: 1.18,
        duration: 1.4,
        ease: "power3.out",
        scrollTrigger: {
          trigger: tile,
          start: "top 80%",
          toggleActions: "play none none reverse",
        },
      });
    });
  </script>

<!-- 图鉴浮条：返回图鉴 + 把这个 demo 的链接和提示词复制给 AI Agent -->
<div id="galleryBar">
  <a href="/" class="gb">← 图鉴</a>
  <button class="gb" id="gbCopy">⧉ 复制给 AI</button>
</div>
<style>
  #galleryBar {
    position: fixed; left: 16px; bottom: 16px; z-index: 9999;
    display: flex; gap: 8px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  #galleryBar .gb {
    font-size: 12px; line-height: 1; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: #8b949e; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    text-decoration: none; backdrop-filter: blur(8px); font-family: inherit;
    transition: color .16s, border-color .16s;
  }
  #galleryBar .gb:hover { color: #58e6a8; border-color: #58e6a8; }
  #galleryBar .gb.done { color: #58e6a8; border-color: rgba(88,230,168,.6); }
  @media (max-width: 520px) { #galleryBar { left: 10px; bottom: 10px; } }
</style>
<script>
  (function () {
    var DEMO = 'clippath-reveal', TITLE = '滚动图片遮罩揭示';
    var origin = location.protocol.startsWith('http') ? location.origin : 'https://gsap.leolee0812.site';
    var text = '参考这个页面：' + origin + '/demos/' + DEMO + '.html\n' +
      '它用 GSAP 3.13 实现了「' + TITLE + '」，源码里有完整可运行的实现和中文注释。\n' +
      '请先读取这个链接，弄清它的实现方式（用到哪些插件、时间轴怎么排、缓动怎么选），\n' +
      '然后把同样的效果复刻到我的项目里：沿用我现有的页面结构和配色，保持一致的节奏和手感。';
    var btn = document.getElementById('gbCopy');
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '✓ 已复制，粘给你的 Agent';
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          btn.textContent = '⧉ 复制给 AI';
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        done();
      }
    });
  })();
</script>
</body>
</html>
