<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>3D 卡片倾斜悬停 · GSAP 实战</title>
<style>
  /* 全局重置与暗色主题变量 */
  :root {
    --bg: #0d1117;
    --text: #e6edf3;
    --accent: #58e6a8;
    --card-from: #161b22;
    --card-to: #0a0e14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 60px 24px;
    /* 背景微弱光晕，增强氛围 */
    background-image: radial-gradient(circle at 50% 0%, rgba(88, 230, 168, 0.08), transparent 60%);
  }

  .headline {
    text-align: center;
    max-width: 640px;
  }
  .headline h1 {
    font-size: clamp(24px, 4vw, 38px);
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .headline h1 span { color: var(--accent); }
  .headline p {
    margin-top: 12px;
    color: #8b949e;
    font-size: 15px;
  }

  /* 卡片容器：核心 perspective 在这里，决定 3D 透视的纵深感 */
  .deck {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: center;
    perspective: 1000px;
  }

  /* 单张卡片：transform-style 保留 3D，子元素才有立体层次 */
  .card {
    position: relative;
    width: 280px;
    height: 380px;
    border-radius: 18px;
    background: linear-gradient(155deg, var(--card-from), var(--card-to));
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    cursor: pointer;
    overflow: hidden;
    transform-style: preserve-3d;
    /* will-change 提示浏览器对 transform 做 GPU 合成优化 */
    will-change: transform;
  }

  /* 高光层：跟随鼠标的径向渐变，制造光泽反射 */
  .card .glow {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    /* 用 CSS 变量定位高光中心，由 JS 实时更新 --mx / --my */
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(255, 255, 255, 0.18),
      rgba(255, 255, 255, 0.04) 30%,
      transparent 55%
    );
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 3;
  }
  /* 悬停时显示高光 */
  .card:hover .glow { opacity: 1; }

  /* 卡片内容：用 translateZ 让其浮在卡面之上，强化立体 */
  .card .content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transform: translateZ(40px);
  }

  .card .badge {
    align-self: flex-start;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(88, 230, 168, 0.12);
    border: 1px solid rgba(88, 230, 168, 0.3);
  }

  .card .title {
    font-size: 23px;
    font-weight: 700;
    line-height: 1.3;
  }
  .card .desc {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa4b0;
    line-height: 1.6;
  }

  .card .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #7d8590;
  }
  .card .foot .arrow {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: #04140d;
    font-size: 18px;
    font-weight: 700;
  }

  .hint {
    color: #6e7681;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="headline">
    <h1>把鼠标移到卡片上 <span>感受 3D 倾斜</span></h1>
    <p>基于 GSAP 控制 transformPerspective / rotateX / rotateY，配合 quickTo 平滑跟随与光泽高光。</p>
  </div>

  <!-- 卡片牌组：perspective 容器内放置三张卡片 -->
  <div class="deck">
    <article class="card">
      <div class="glow"></div>
      <div class="content">
        <span class="badge">产品</span>
        <div>
          <h2 class="title">极速渲染引擎</h2>
          <p class="desc">基于 GPU 合成的高性能动画方案，60fps 流畅交互，零卡顿体验。</p>
        </div>
        <div class="foot"><span>了解更多</span><span class="arrow">&#8599;</span></div>
      </div>
    </article>

    <article class="card">
      <div class="glow"></div>
      <div class="content">
        <span class="badge">作品集</span>
        <div>
          <h2 class="title">沉浸式视觉设计</h2>
          <p class="desc">将光影、景深与微交互融为一体，让每一次悬停都成为细节的惊喜。</p>
        </div>
        <div class="foot"><span>查看案例</span><span class="arrow">&#8599;</span></div>
      </div>
    </article>

    <article class="card">
      <div class="glow"></div>
      <div class="content">
        <span class="badge">实战</span>
        <div>
          <h2 class="title">GSAP 动效实验</h2>
          <p class="desc">用最少的代码实现专业级动画，可直接复用到真实项目中的交互模式。</p>
        </div>
        <div class="foot"><span>动手实践</span><span class="arrow">&#8599;</span></div>
      </div>
    </article>
  </div>

  <p class="hint">鼠标移开自动平滑复位</p>

  <!-- 只引入 GSAP 核心 -->
  <script src="../lib/gsap.min.js"></script>
  <script>
    // 最大倾斜角度（度），数值越大立体感越强
    const MAX_TILT = 12;

    // 为每张卡片单独绑定交互，避免相互干扰
    document.querySelectorAll(".card").forEach((card) => {
      const glow = card.querySelector(".glow");

      // gsap.quickTo 为每个属性创建高性能补间函数，
      // 比每次 gsap.to 新建动画更省，能让倾斜如丝般平滑跟随鼠标。
      const rotX = gsap.quickTo(card, "rotationX", { duration: 0.5, ease: "power3.out" });
      const rotY = gsap.quickTo(card, "rotationY", { duration: 0.5, ease: "power3.out" });

      // 进入卡片时轻微抬升缩放，强化“浮起”感
      card.addEventListener("mouseenter", () => {
        gsap.to(card, {
          scale: 1.04,
          duration: 0.4,
          ease: "power2.out",
          transformPerspective: 1000, // 卡片自身的透视，使倾斜更真实
        });
      });

      // 移动时根据鼠标相对卡片中心的位置计算旋转角与高光位置
      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        // 归一化到 -0.5 ~ 0.5
        const px = (e.clientX - rect.left) / rect.width - 0.5;
        const py = (e.clientY - rect.top) / rect.height - 0.5;

        // 鼠标在上方 -> 卡片向后仰（rotateX 取负），符合自然透视直觉
        rotX(-py * MAX_TILT);
        rotY(px * MAX_TILT);

        // 更新高光中心（百分比），让光泽点跟随鼠标
        glow.style.setProperty("--mx", `${(px + 0.5) * 100}%`);
        glow.style.setProperty("--my", `${(py + 0.5) * 100}%`);
      });

      // 离开时平滑复位：角度归零、缩放还原
      card.addEventListener("mouseleave", () => {
        rotX(0);
        rotY(0);
        gsap.to(card, { scale: 1, duration: 0.6, ease: "power3.out" });
      });
    });
  </script>
</body>
</html>
