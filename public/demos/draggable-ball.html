<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>5. Draggable · 拖拽 + 惯性甩动</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}
  .hint{opacity:.5;font-size:15px;text-align:center}
  .pad{position:relative;width:min(640px,92vw);height:420px;background:#161b22;border:1px solid #30363d;border-radius:20px;overflow:hidden}
  .puck{position:absolute;top:170px;left:280px;width:90px;height:90px;border-radius:50%;cursor:grab;
    background:linear-gradient(135deg,#58e6a8,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:30px;user-select:none}
  .puck:active{cursor:grabbing}
</style>
</head>
<body>
<p class="hint">抓住小球拖动 → 松手后会带惯性继续滑、撞到边界回弹（Draggable + Inertia）</p>
<div class="pad" id="pad">
  <div class="puck" id="puck">🏒</div>
</div>

<script src="../lib/gsap.min.js"></script>
<script src="../lib/Draggable.min.js"></script>
<script src="../lib/InertiaPlugin.min.js"></script>
<script>
  gsap.registerPlugin(Draggable, InertiaPlugin);

  Draggable.create("#puck",{
    bounds:"#pad",          // 限制在面板内
    inertia:true,           // 松手后惯性滑动
    edgeResistance:0.65,    // 边界阻力
    onDrag(){ gsap.to(this.target,{scale:1.15,duration:0.2}); },
    onDragEnd(){ gsap.to(this.target,{scale:1,duration:0.3}); }
  });
</script>
</body>
</html>
