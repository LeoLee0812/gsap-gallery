<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>段落逐行遮罩揭示</title>
<style>
  /* 暗色主题基础样式 */
  :root {
    --bg: #0d1117;
    --text: #e6edf3;
    --accent: #58e6a8;
    --card: #161b22;
    --border: #30363d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 56px 48px;
    max-width: 680px;
    width: 100%;
  }
  .paragraph {
    font-size: clamp(20px, 3.5vw, 30px);
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.2px;
  }
  /* 高亮强调色 */
  .paragraph b { color: var(--accent); font-weight: 700; }

  /* SplitText 拆出的每一行：作为遮罩容器，溢出隐藏 */
  .paragraph .mask {
    overflow: hidden;
    display: block;
  }
  /* 行内真实文字，受 mask 裁切，从下方升起 */
  .paragraph .line {
    display: block;
    will-change: transform;
  }

  .replay {
    margin-top: 40px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 22px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .replay:hover {
    background: rgba(88, 230, 168, 0.1);
    border-color: var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <!-- 注意：SplitText 按行拆中文时，会在每个嵌套标签（这里的 <b>）边界强制断行——
     中文没有空格，它把整个 <b> 当成一个不可分割的词。
     所以高亮片段必须自成一个分句、并且把句读标点包进 <b> 里面，
     否则断点会落在句子中间，标点被甩到行首。 -->
    <p class="paragraph" id="para">设计的本质不是装饰，而是沟通。<b>每一行文字都应当在恰当的时机出现，引导视线自然地向下流动。</b>当节奏与内容契合，信息便不再是负担，而成为一种愉悦的体验。</p>
    <button class="replay" id="replay">↻ 重播</button>
  </div>

  <script src="../lib/gsap.min.js"></script>
  <script src="../lib/SplitText.min.js"></script>
  <script>
    // 注册 SplitText 插件
    gsap.registerPlugin(SplitText);

    const para = document.getElementById("para");
    let split;       // SplitText 实例
    let tween;       // 当前动画

    // 构建并播放逐行揭示动画
    function play() {
      // 若已存在，先回收旧的拆分与动画，避免重复包裹
      if (tween) tween.kill();
      if (split) split.revert();

      // 按行拆分，每行元素加 .line 类作为升起的文字本体
      split = new SplitText(para, { type: "lines", linesClass: "line" });

      // 给每一行外面包一个 .mask 遮罩容器（overflow:hidden），
      // 这样行文字升起时会被遮罩边缘裁切，形成“从遮罩里升起”的效果
      split.lines.forEach(line => {
        const mask = document.createElement("div");
        mask.className = "mask";
        line.parentNode.insertBefore(mask, line);
        mask.appendChild(line);
      });

      // 行文字从遮罩下方升起，逐行 stagger 入场
      tween = gsap.from(split.lines, {
        yPercent: 100,
        duration: 0.9,
        ease: "power3.out",
        stagger: 0.12
      });
    }

    // 字体加载完成后再执行，避免拆行测量错位
    document.fonts.ready.then(play);

    // 重播按钮
    document.getElementById("replay").addEventListener("click", play);
  </script>

<!-- 图鉴浮条：返回图鉴 + 把这个 demo 的链接和提示词复制给 AI Agent -->
<div id="galleryBar">
  <a href="/" class="gb">← 图鉴</a>
  <button class="gb" id="gbCopy">⧉ 复制给 AI</button>
</div>
<style>
  #galleryBar {
    position: fixed; left: 16px; bottom: 16px; z-index: 9999;
    display: flex; gap: 8px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  #galleryBar .gb {
    font-size: 12px; line-height: 1; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: #8b949e; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    text-decoration: none; backdrop-filter: blur(8px); font-family: inherit;
    transition: color .16s, border-color .16s;
  }
  #galleryBar .gb:hover { color: #58e6a8; border-color: #58e6a8; }
  #galleryBar .gb.done { color: #58e6a8; border-color: rgba(88,230,168,.6); }
  @media (max-width: 520px) { #galleryBar { left: 10px; bottom: 10px; } }
</style>
<script>
  (function () {
    var DEMO = 'lines-reveal', TITLE = '段落逐行遮罩揭示';
    var origin = location.protocol.startsWith('http') ? location.origin : 'https://gsap.leolee0812.site';
    var text = '参考这个页面：' + origin + '/demos/' + DEMO + '.html\n' +
      '它用 GSAP 3.13 实现了「' + TITLE + '」，源码里有完整可运行的实现和中文注释。\n' +
      '请先读取这个链接，弄清它的实现方式（用到哪些插件、时间轴怎么排、缓动怎么选），\n' +
      '然后把同样的效果复刻到我的项目里：沿用我现有的页面结构和配色，保持一致的节奏和手感。';
    var btn = document.getElementById('gbCopy');
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '✓ 已复制，粘给你的 Agent';
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          btn.textContent = '⧉ 复制给 AI';
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        done();
      }
    });
  })();
</script>
</body>
</html>
