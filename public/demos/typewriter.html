<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSAP 打字机动效</title>
  <style>
    :root {
      --bg: #0d1117;
      --text: #e6edf3;
      --accent: #58e6a8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #161b22, var(--bg));
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      color: var(--text);
    }
    .terminal {
      width: min(680px, 90vw);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    /* 顶部仿 macOS 窗口栏 */
    .bar {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }
    .screen {
      padding: 36px 28px;
      font-size: 22px;
      line-height: 1.6;
      min-height: 120px;
    }
    .prompt { color: var(--accent); }
    /* 闪烁光标 */
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: var(--accent);
      vertical-align: text-bottom;
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="bar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
    <div class="screen">
      <span class="prompt">$ </span><span id="text"></span><span class="cursor" id="cursor"></span>
    </div>
  </div>

  <!-- GSAP 核心 + TextPlugin -->
  <script src="../lib/gsap.min.js"></script>
  <script src="../lib/TextPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(TextPlugin);

    // 要循环打出的几句话
    const lines = [
      "正在用 GSAP 打字...",
      "支持滚动动画、时间轴、拆字效果。",
      "现在 100% 免费，含所有插件。",
      "试试 npx skills add greensock/gsap-skills",
    ];

    // 光标常驻闪烁
    gsap.to("#cursor", {
      opacity: 0,
      duration: 0.5,
      repeat: -1,
      yoyo: true,
      ease: "steps(1)",
    });

    // 主时间轴：逐句打出 -> 停留 -> 删除 -> 下一句，无限循环
    const tl = gsap.timeline({ repeat: -1 });
    lines.forEach((line) => {
      tl.to("#text", {
        // duration 随字数变化，模拟匀速打字
        duration: line.length * 0.08,
        text: { value: line, delimiter: "" },
        ease: "none",
      })
        .to({}, { duration: 1.2 }) // 打完停留
        .to("#text", {
          duration: 0.6,
          text: { value: "", delimiter: "" }, // 退格删除
          ease: "none",
        });
    });
  </script>
</body>
</html>
