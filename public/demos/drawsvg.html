<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>7. DrawSVG · 线条描边动画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}
  .hint{opacity:.5;font-size:15px}
  svg{width:min(420px,80vw);height:auto}
  path,circle{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  button{padding:12px 28px;border:0;border-radius:30px;background:#58e6a8;color:#0d1117;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<p class="hint">✍️ 线条像被「画」出来一样逐渐显现（DrawSVG 描边动画）</p>
<svg viewBox="0 0 200 200">
  <circle id="ring" cx="100" cy="100" r="80" stroke="#3b82f6"/>
  <!-- 一个对勾 -->
  <path id="check" d="M60,105 L90,135 L145,70" stroke="#58e6a8"/>
</svg>
<button onclick="play()">▶ 重新播放</button>

<script src="../lib/gsap.min.js"></script>
<script src="../lib/DrawSVGPlugin.min.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);

  function play(){
    gsap.timeline()
      .from("#ring",{ drawSVG:"0%", duration:1.2, ease:"power2.inOut" })   // 先画圆环
      .from("#check",{ drawSVG:"0%", duration:0.6, ease:"power2.out" },"-=0.2"); // 再打对勾
  }
  play();
</script>

<!-- 图鉴浮条：返回图鉴 + 把这个 demo 的链接和提示词复制给 AI Agent -->
<div id="galleryBar">
  <a href="/" class="gb">← 图鉴</a>
  <button class="gb" id="gbCopy">⧉ 复制给 AI</button>
</div>
<style>
  #galleryBar {
    position: fixed; left: 16px; bottom: 16px; z-index: 9999;
    display: flex; gap: 8px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  #galleryBar .gb {
    font-size: 12px; line-height: 1; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: #8b949e; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    text-decoration: none; backdrop-filter: blur(8px); font-family: inherit;
    transition: color .16s, border-color .16s;
  }
  #galleryBar .gb:hover { color: #58e6a8; border-color: #58e6a8; }
  #galleryBar .gb.done { color: #58e6a8; border-color: rgba(88,230,168,.6); }
  @media (max-width: 520px) { #galleryBar { left: 10px; bottom: 10px; } }
</style>
<script>
  (function () {
    var DEMO = 'drawsvg', TITLE = '7. DrawSVG · 线条描边动画';
    var origin = location.protocol.startsWith('http') ? location.origin : 'https://gsap.leolee0812.site';
    var text = '参考这个页面：' + origin + '/demos/' + DEMO + '.html\n' +
      '它用 GSAP 3.13 实现了「' + TITLE + '」，源码里有完整可运行的实现和中文注释。\n' +
      '请先读取这个链接，弄清它的实现方式（用到哪些插件、时间轴怎么排、缓动怎么选），\n' +
      '然后把同样的效果复刻到我的项目里：沿用我现有的页面结构和配色，保持一致的节奏和手感。';
    var btn = document.getElementById('gbCopy');
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '✓ 已复制，粘给你的 Agent';
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          btn.textContent = '⧉ 复制给 AI';
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        done();
      }
    });
  })();
</script>
</body>
</html>
