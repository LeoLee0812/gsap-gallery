<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>SVG Logo 描边绘制 + 填色</title>
<style>
  /* 暗色主题基础样式 */
  :root {
    --bg: #0d1117;
    --text: #e6edf3;
    --accent: #58e6a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
  /* logo 容器 */
  .logo-wrap {
    width: 360px;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  /* 描边路径：初始无填充，靠 stroke 勾勒轮廓 */
  .stroke-path {
    fill: var(--accent);
    fill-opacity: 0;          /* 填色初始透明，后续淡入 */
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 重播按钮 */
  .replay-btn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 10px 28px;
    border-radius: 24px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.25s, color 0.25s;
  }
  .replay-btn:hover {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <!-- 几何 logo：六边形外框 + 内部字母 G（GSAP 风格开场） -->
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- 外层六边形轮廓 -->
      <path class="stroke-path" d="M100 18 L171 59 L171 141 L100 182 L29 141 L29 59 Z"/>
      <!-- 内部字母 G 描边 -->
      <path class="stroke-path" d="M128 78 A38 38 0 1 0 128 122 L128 104 L104 104"/>
    </svg>
  </div>

  <button class="replay-btn" id="replay">重播动画</button>

  <!-- 加载 GSAP 核心与 DrawSVG 插件 -->
  <script src="../lib/gsap.min.js"></script>
  <script src="../lib/DrawSVGPlugin.min.js"></script>
  <script>
    // 注册 DrawSVG 插件
    gsap.registerPlugin(DrawSVGPlugin);

    const paths = document.querySelectorAll('.stroke-path');
    const logoWrap = document.querySelector('.logo-wrap');

    // 构建动画时间线
    function buildTimeline() {
      const tl = gsap.timeline();

      // 1. 描边：每条路径 drawSVG 从 0% 到 100%，逐笔画出
      tl.fromTo(paths,
        { drawSVG: '0%' },
        {
          drawSVG: '100%',
          duration: 1.4,
          ease: 'power1.inOut',
          stagger: 0.4          // 路径之间错开，形成"逐笔"感
        }
      );

      // 2. 填色：fill-opacity 从 0 淡入到 1
      tl.to(paths,
        {
          fillOpacity: 1,
          duration: 0.6,
          ease: 'power1.out'
        },
        '+=0.1'                 // 描边完成后略作停顿再填色
      );

      // 3. 整体轻微缩放定格：先放大再回落
      tl.to(logoWrap,
        {
          scale: 1.08,
          duration: 0.35,
          ease: 'power2.out'
        }
      ).to(logoWrap,
        {
          scale: 1,
          duration: 0.5,
          ease: 'elastic.out(1, 0.5)'
        }
      );

      return tl;
    }

    let timeline = buildTimeline();

    // 重播：重置状态后重新播放
    document.getElementById('replay').addEventListener('click', () => {
      timeline.kill();
      gsap.set(paths, { fillOpacity: 0 });
      gsap.set(logoWrap, { scale: 1 });
      timeline = buildTimeline();
    });
  </script>

<!-- 图鉴浮条：返回图鉴 + 把这个 demo 的链接和提示词复制给 AI Agent -->
<div id="galleryBar">
  <a href="/" class="gb">← 图鉴</a>
  <button class="gb" id="gbCopy">⧉ 复制给 AI</button>
</div>
<style>
  #galleryBar {
    position: fixed; left: 16px; bottom: 16px; z-index: 9999;
    display: flex; gap: 8px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  #galleryBar .gb {
    font-size: 12px; line-height: 1; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: #8b949e; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    text-decoration: none; backdrop-filter: blur(8px); font-family: inherit;
    transition: color .16s, border-color .16s;
  }
  #galleryBar .gb:hover { color: #58e6a8; border-color: #58e6a8; }
  #galleryBar .gb.done { color: #58e6a8; border-color: rgba(88,230,168,.6); }
  @media (max-width: 520px) { #galleryBar { left: 10px; bottom: 10px; } }
</style>
<script>
  (function () {
    var DEMO = 'logo-draw', TITLE = 'SVG Logo 描边绘制 + 填色';
    var origin = location.protocol.startsWith('http') ? location.origin : 'https://gsap.leolee0812.site';
    var text = '参考这个页面：' + origin + '/demos/' + DEMO + '.html\n' +
      '它用 GSAP 3.13 实现了「' + TITLE + '」，源码里有完整可运行的实现和中文注释。\n' +
      '请先读取这个链接，弄清它的实现方式（用到哪些插件、时间轴怎么排、缓动怎么选），\n' +
      '然后把同样的效果复刻到我的项目里：沿用我现有的页面结构和配色，保持一致的节奏和手感。';
    var btn = document.getElementById('gbCopy');
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '✓ 已复制，粘给你的 Agent';
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          btn.textContent = '⧉ 复制给 AI';
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        done();
      }
    });
  })();
</script>
</body>
</html>
