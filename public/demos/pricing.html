<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>定价卡片 · GSAP 动效</title>
<style>
  /* 暗色主题全局样式 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #8b949e;
    font-size: 15px;
    margin-bottom: 48px;
  }
  /* 卡片容器，三列布局 */
  .cards {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  /* 单张定价卡片 */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 32px 28px;
    width: 280px;
    /* 初始隐藏，由 GSAP 控制入场 */
    opacity: 0;
    cursor: pointer;
    will-change: transform, opacity;
  }
  /* 推荐卡片更大并带强调色边框 */
  .card.featured {
    border: 1.5px solid #58e6a8;
    box-shadow: 0 0 30px rgba(88, 230, 168, 0.12);
  }
  .badge {
    display: inline-block;
    background: #58e6a8;
    color: #0d1117;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .plan-name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .plan-desc {
    color: #8b949e;
    font-size: 13px;
    margin-bottom: 24px;
    min-height: 36px;
  }
  .price {
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .price .unit {
    font-size: 15px;
    color: #8b949e;
    font-weight: 400;
  }
  .features {
    list-style: none;
    margin: 24px 0;
  }
  .features li {
    font-size: 14px;
    color: #c9d1d9;
    padding: 8px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .features li::before {
    content: "✓";
    color: #58e6a8;
    font-weight: 700;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: 1px solid #30363d;
    background: transparent;
    color: #e6edf3;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn:hover { border-color: #58e6a8; }
  /* 推荐卡片按钮使用强调色填充 */
  .featured .btn {
    background: #58e6a8;
    color: #0d1117;
    border-color: #58e6a8;
  }
</style>
</head>
<body>
  <h1>选择适合你的套餐</h1>
  <p class="subtitle">随时升级或降级，按月灵活计费</p>

  <div class="cards">
    <!-- 基础套餐 -->
    <div class="card">
      <div class="plan-name">基础版</div>
      <div class="plan-desc">适合个人开发者起步使用</div>
      <div class="price">¥29<span class="unit">/月</span></div>
      <ul class="features">
        <li>1 个项目</li>
        <li>5GB 存储空间</li>
        <li>社区支持</li>
      </ul>
      <button class="btn">开始使用</button>
    </div>

    <!-- 推荐套餐（中间，更大） -->
    <div class="card featured">
      <span class="badge">推荐</span>
      <div class="plan-name">专业版</div>
      <div class="plan-desc">适合成长中的团队与项目</div>
      <div class="price">¥99<span class="unit">/月</span></div>
      <ul class="features">
        <li>无限项目</li>
        <li>100GB 存储空间</li>
        <li>优先邮件支持</li>
        <li>高级分析面板</li>
      </ul>
      <button class="btn">立即选择</button>
    </div>

    <!-- 企业套餐 -->
    <div class="card">
      <div class="plan-name">企业版</div>
      <div class="plan-desc">适合大规模团队定制需求</div>
      <div class="price">¥299<span class="unit">/月</span></div>
      <ul class="features">
        <li>无限项目与成员</li>
        <li>1TB 存储空间</li>
        <li>专属客户经理</li>
      </ul>
      <button class="btn">联系销售</button>
    </div>
  </div>

  <!-- GSAP 核心库 -->
  <script src="../lib/gsap.min.js"></script>
  <script>
    const cards = gsap.utils.toArray(".card");
    const featured = document.querySelector(".card.featured");

    // 推荐卡片初始尺寸更大（scale 放大）
    gsap.set(featured, { scale: 1.06 });

    // 入场 timeline：三张卡片 stagger 依次上浮淡入
    // 注意：卡片在 CSS 里就是 opacity:0（防止入场前闪一下），
    // 所以这里必须用 fromTo 把终点显式写成 opacity:1。
    // 若写成 gsap.from({opacity:0})，from 会把「当前值」当终点 —— 当前值正好是 0，
    // 动画就成了 0 → 0，三张卡片永远不显示。
    const intro = gsap.timeline();
    intro.fromTo(cards,
      { y: 60, opacity: 0 },
      {
        y: 0,
        opacity: 1,
        duration: 0.7,
        ease: "power3.out",
        stagger: 0.15
        // 这里千万别用 clearProps:"opacity" 收尾：清掉行内值之后，
        // CSS 里的 .card{opacity:0} 会重新生效，推荐卡片当场消失。
      }
    );

    // 推荐卡片入场后持续轻微浮动（yoyo 循环）
    intro.to(featured, {
      y: -10,
      duration: 1.8,
      ease: "sine.inOut",
      repeat: -1,
      yoyo: true
    }, ">-0.2");

    // 悬停交互：放大上浮当前卡，其余略微暗淡
    cards.forEach((card) => {
      const isFeatured = card.classList.contains("featured");
      const baseScale = isFeatured ? 1.06 : 1;

      card.addEventListener("mouseenter", () => {
        // 当前卡片放大上浮
        gsap.to(card, {
          scale: baseScale + 0.06,
          y: "-=8",
          duration: 0.35,
          ease: "power2.out",
          overwrite: "auto"
        });
        // 其他卡片降低不透明度
        cards.forEach((other) => {
          if (other !== card) {
            gsap.to(other, { opacity: 0.5, duration: 0.35, overwrite: "auto" });
          }
        });
      });

      card.addEventListener("mouseleave", () => {
        // 恢复当前卡片缩放与位移
        gsap.to(card, {
          scale: baseScale,
          y: isFeatured ? 0 : 0,
          duration: 0.35,
          ease: "power2.out",
          overwrite: "auto"
        });
        // 其他卡片恢复不透明度
        cards.forEach((other) => {
          if (other !== card) {
            gsap.to(other, { opacity: 1, duration: 0.35, overwrite: "auto" });
          }
        });
      });
    });
  </script>

<!-- 图鉴浮条：返回图鉴 + 把这个 demo 的链接和提示词复制给 AI Agent -->
<div id="galleryBar">
  <a href="/" class="gb">← 图鉴</a>
  <button class="gb" id="gbCopy">⧉ 复制给 AI</button>
</div>
<style>
  #galleryBar {
    position: fixed; left: 16px; bottom: 16px; z-index: 9999;
    display: flex; gap: 8px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  #galleryBar .gb {
    font-size: 12px; line-height: 1; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    color: #8b949e; background: rgba(22,27,34,.92); border: 1px solid #30363d;
    text-decoration: none; backdrop-filter: blur(8px); font-family: inherit;
    transition: color .16s, border-color .16s;
  }
  #galleryBar .gb:hover { color: #58e6a8; border-color: #58e6a8; }
  #galleryBar .gb.done { color: #58e6a8; border-color: rgba(88,230,168,.6); }
  @media (max-width: 520px) { #galleryBar { left: 10px; bottom: 10px; } }
</style>
<script>
  (function () {
    var DEMO = 'pricing', TITLE = '定价卡片 · GSAP 动效';
    var origin = location.protocol.startsWith('http') ? location.origin : 'https://gsap.leolee0812.site';
    var text = '参考这个页面：' + origin + '/demos/' + DEMO + '.html\n' +
      '它用 GSAP 3.13 实现了「' + TITLE + '」，源码里有完整可运行的实现和中文注释。\n' +
      '请先读取这个链接，弄清它的实现方式（用到哪些插件、时间轴怎么排、缓动怎么选），\n' +
      '然后把同样的效果复刻到我的项目里：沿用我现有的页面结构和配色，保持一致的节奏和手感。';
    var btn = document.getElementById('gbCopy');
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '✓ 已复制，粘给你的 Agent';
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(function () {
          btn.textContent = '⧉ 复制给 AI';
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        done();
      }
    });
  })();
</script>
</body>
</html>
