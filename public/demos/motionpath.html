<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>6. MotionPath · 沿路径运动</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}
  .hint{opacity:.5;font-size:15px}
  svg{width:min(560px,92vw);height:auto;background:#161b22;border:1px solid #30363d;border-radius:20px}
  .track{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 8}
</style>
</head>
<body>
<p class="hint">🚀 火箭沿着这条曲线飞行，并自动转向朝向前进方向（autoRotate）</p>
<svg viewBox="0 0 500 400">
  <!-- 运动轨迹（虚线只是可视化，火箭会贴着它走） -->
  <path id="track" class="track" d="M50,350 C50,150 250,400 250,200 S450,50 450,300"/>
  <text id="rocket" x="0" y="0" font-size="40" text-anchor="middle" dominant-baseline="central">🚀</text>
</svg>

<script src="../lib/gsap.min.js"></script>
<script src="../lib/MotionPathPlugin.min.js"></script>
<script>
  gsap.registerPlugin(MotionPathPlugin);

  gsap.to("#rocket",{
    duration:4, repeat:-1, ease:"power1.inOut", yoyo:true,
    motionPath:{
      path:"#track",      // 直接引用 SVG 路径
      align:"#track",
      autoRotate:90,      // 让火箭头始终朝前（+90° 对齐表情方向）
      alignOrigin:[0.5,0.5]
    }
  });
</script>
</body>
</html>
