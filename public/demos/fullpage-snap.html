<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>全屏整屏翻页 Fullpage Snap</title>
<style>
  /* 暗色主题基础样式 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden; /* 隐藏滚动条，由 Observer 接管手势 */
    background: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* 翻页容器：堆叠所有 section */
  #fullpage {
    position: relative;
    height: 100vh;
    width: 100%;
  }

  /* 每一屏全屏铺满，绝对定位堆叠在同一位置，靠 yPercent 平移切换 */
  .section {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  /* 屏内卡片 */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 48px 56px;
    max-width: 640px;
  }
  .section .index {
    font-size: 14px;
    letter-spacing: 4px;
    color: #58e6a8;
    margin-bottom: 16px;
  }
  .section h1 {
    font-size: clamp(32px, 6vw, 56px);
    margin-bottom: 16px;
    line-height: 1.15;
  }
  .section p {
    font-size: clamp(15px, 2vw, 18px);
    color: #9aa7b4;
    line-height: 1.7;
  }

  /* 右侧页码指示点 */
  #dots {
    position: fixed;
    top: 50%;
    right: 28px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #30363d;
    background: transparent;
    cursor: pointer;
    transition: background 0.3s, border-color 0.3s, transform 0.3s;
  }
  .dot.active {
    background: #58e6a8;
    border-color: #58e6a8;
    transform: scale(1.25);
  }

  /* 底部提示 */
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #6e7b8a;
    z-index: 10;
  }
</style>
</head>
<body>
  <div id="fullpage">
    <section class="section" style="background:#0d1117">
      <div class="card">
        <div class="index">SECTION 01</div>
        <h1>全屏整屏翻页</h1>
        <p>滚动鼠标滚轮、按上下方向键，或在触屏上滑动，每次平滑切换到上一屏或下一屏并自动吸附。</p>
      </div>
    </section>

    <section class="section" style="background:#10151c">
      <div class="card">
        <div class="index">SECTION 02</div>
        <h1>平滑吸附</h1>
        <p>每次手势只翻一屏，利用节流锁定动画期间的连续触发，避免一次滚动跨越多屏。</p>
      </div>
    </section>

    <section class="section" style="background:#0d1117">
      <div class="card">
        <div class="index">SECTION 03</div>
        <h1>手势接管</h1>
        <p>由 GSAP Observer 统一监听 wheel 与 touch 事件，回调 onUp / onDown 决定翻页方向。</p>
      </div>
    </section>

    <section class="section" style="background:#10151c">
      <div class="card">
        <div class="index">SECTION 04</div>
        <h1>最后一屏</h1>
        <p>右侧页码指示点实时高亮当前屏，也可直接点击指示点跳转到任意一屏。</p>
      </div>
    </section>
  </div>

  <!-- 右侧页码指示点 -->
  <div id="dots"></div>

  <!-- 底部操作提示 -->
  <div id="hint">滚轮 / 上下键 / 触摸滑动翻页</div>

  <script src="../lib/gsap.min.js"></script>
  <script src="../lib/Observer.min.js"></script>
  <script>
    // 注册 Observer 插件
    gsap.registerPlugin(Observer);

    const sections = gsap.utils.toArray(".section");
    const total = sections.length;
    let current = 0;      // 当前屏索引
    let animating = false; // 节流标志：动画进行中禁止再次触发

    // 初始化各屏位置：第一屏归位，其余排到下方（yPercent 100）
    gsap.set(sections, { yPercent: 100 });
    gsap.set(sections[0], { yPercent: 0 });

    // 生成右侧页码指示点
    const dotsBox = document.getElementById("dots");
    const dots = sections.map((_, i) => {
      const d = document.createElement("div");
      d.className = "dot" + (i === 0 ? " active" : "");
      d.addEventListener("click", () => goTo(i)); // 点击指示点跳转
      dotsBox.appendChild(d);
      return d;
    });

    // 更新指示点高亮状态
    function updateDots() {
      dots.forEach((d, i) => d.classList.toggle("active", i === current));
    }

    // 跳转到指定屏：direction 为 1（向下）或 -1（向上）
    function goTo(index) {
      // 越界或正在动画中则忽略
      if (index < 0 || index >= total || index === current || animating) return;
      animating = true;

      const prev = current;
      const direction = index > prev ? 1 : -1;

      // 即将进入的屏：从屏外（方向决定上下）滑入到 0
      gsap.set(sections[index], { yPercent: direction === 1 ? 100 : -100 });

      const tl = gsap.timeline({
        defaults: { duration: 0.9, ease: "power2.inOut" },
        onComplete: () => { animating = false; } // 动画结束解除节流
      });

      // 当前屏滑出，新屏滑入
      tl.to(sections[prev], { yPercent: direction === 1 ? -100 : 100 }, 0)
        .to(sections[index], { yPercent: 0 }, 0);

      current = index;
      updateDots();
    }

    // 创建手势监听器：滚轮 + 触摸
    Observer.create({
      type: "wheel,touch,pointer",
      wheelSpeed: -1,
      tolerance: 10,          // 滑动容差，过滤微小抖动
      preventDefault: true,
      onUp: () => goTo(current - 1),   // 向上滑 / 滚轮上：上一屏
      onDown: () => goTo(current + 1), // 向下滑 / 滚轮下：下一屏
    });

    // 键盘上下键支持
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "PageDown") goTo(current + 1);
      if (e.key === "ArrowUp" || e.key === "PageUp") goTo(current - 1);
    });
  </script>
</body>
</html>
