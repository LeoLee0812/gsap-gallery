<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22c3-9 8-13 14-12' stroke='%2358e6a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%233b82f6'/%3E%3C/svg%3E">
<title>3. SplitText · 文字逐字动画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:50px;
    background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}
  h1{font-size:clamp(36px,8vw,90px);font-weight:800;
    background:linear-gradient(135deg,#58e6a8,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:clamp(24px,5vw,52px);font-weight:700}
  button{padding:12px 28px;border:0;border-radius:30px;background:#58e6a8;color:#0d1117;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<h1 id="line1">逐字蹦出的大标题</h1>
<h2 id="line2">这一行是波浪式起伏</h2>
<button onclick="play()">▶ 重新播放</button>

<script src="../lib/gsap.min.js"></script>
<script src="../lib/SplitText.min.js"></script>
<script>
  gsap.registerPlugin(SplitText);

  function play(){
    // 把标题拆成单个字符
    const s1 = new SplitText("#line1",{type:"chars"});
    const s2 = new SplitText("#line2",{type:"chars"});

    gsap.timeline()
      .from(s1.chars,{ // 第一行：逐字从下方弹起
        y:80, opacity:0, rotateX:-90, duration:0.8,
        ease:"back.out(2)", stagger:0.05
      })
      .from(s2.chars,{ // 第二行：逐字波浪起伏
        y:30, opacity:0, duration:0.5,
        ease:"sine.out", stagger:{each:0.04, from:"start"}
      },"-=0.3");
  }
  // 等字体加载后再拆，避免错位
  document.fonts.ready.then(play);
</script>
</body>
</html>
